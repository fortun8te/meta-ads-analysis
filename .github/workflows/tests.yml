name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and CLI tests
        run: python -m unittest discover -s tests -t . -v
      - name: Synthetic examples
        run: |
          python scripts/analyze_meta.py examples/campaign.json --mode metrics > /tmp/metrics.json
          python scripts/analysis_views.py examples/campaign.json --view compact > /tmp/compact.json
          python scripts/analysis_views.py examples/campaign.json --view focus --fields metrics.spend,metrics.purchases,derived_metrics.purchase_roas > /tmp/focus.json
          python scripts/analysis_views.py examples/change-drivers.json --view drivers > /tmp/drivers.json
